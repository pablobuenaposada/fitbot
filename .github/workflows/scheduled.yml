name: StudioCrossfit reservation scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studiocrossfit-reservations
  cancel-in-progress: false

jobs:
  reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests pysocks beautifulsoup4

      - name: Check configuration
        run: python -m json.tool reservas.json > /dev/null

      - name: Run scheduler
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          PROXY: ${{ secrets.PROXY }}
          DRY_RUN: "true"
        run: PYTHONPATH=src python src/scheduled.py
